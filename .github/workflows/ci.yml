name: CI

# Every branch, not just main. A feature branch that cannot be tested until it
# opens a pull request is a branch developed blind.
on:
  push:
  pull_request:

jobs:
  # Both platforms, because this is POSIX C and the two libcs differ in ways that
  # compile silently: getopt_long's argument permutation and strcasecmp are both
  # extensions, and a difference in either would only show up by running it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test

  # -Wall cannot see a read past the end of a heap allocation, which is most of
  # what the hand-written structures here could get wrong. On Linux this also
  # brings LeakSanitizer, which is off by default on macOS.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests and smoke runs under ASan and UBSan
        run: make sanitize
